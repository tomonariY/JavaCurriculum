# テスト専用 DB（開発用 todo_app とは必ず別の DB にする）
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/todo_test
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# テスト起動のたびにスキーマを作り直す
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:test-schema.sql

mybatis.type-aliases-package=sample.common.dao.entity
mybatis.mapper-locations=classpath:sample/common/dao/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true