<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>タスク新規作成</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/form.css}">
    <!-- ローカル用 CSS -->
    <link rel="stylesheet" href="../../static/css/style.css">
    <link rel="stylesheet" href="../../static/css/form.css">
</head>

<body>

    <div class="form-container">
        <div class="form-card">
            <form id="new-form">
                <h1>タスク新規作成（API版）</h1>

                <div class="form-group">
                    <label for="title">タイトル</label>
                    <input id="title" type="text" placeholder="タスクのタイトルを入力">
                </div>

                <div class="form-group">
                    <label for="content">内容</label>
                    <textarea id="content" placeholder="タスクの詳細内容を入力"></textarea>
                </div>

                <div class="form-group">
                    <label for="startDate">開始日</label>
                    <input id="startDate" type="date">
                </div>

                <div class="form-group">
                    <label for="endDate">終了日</label>
                    <input id="endDate" type="date">
                </div>

                <div class="form-actions">
                    <button id="btn-add" type="button" class="btn-submit">追加する</button>
                    <a href="/tasks/live" class="btn-cancel">キャンセル</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 新規追加用メソッド
        document.getElementById('btn-add').addEventListener('click', function () {
            const requestBody = {
                title: document.getElementById('title').value,
                content: document.getElementById('content').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value
            }

            fetch('/api/tasks' , {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(requestBody)
            })
                .then(function (response) {
                    if(!response.ok) {
                        throw new Error('新規追加に失敗しました');
                    }
                    location.href = '/tasks/live';
                })
                .catch(function (error) {
                    alert('新規追加に失敗しました');
                });
        });
    </script>
</body>

</html>
